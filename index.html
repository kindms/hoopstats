<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>投籃命中率 · HoopStats</title>
<style>
  :root{
    --bg:#0b1020; --card:#151b30; --line:#243052; --ink:#eef2ff;
    --muted:#93a0c4; --brand:#ff7a2f; --brand2:#ffb066; --good:#37d67a; --bad:#ff5470;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  .wrap{max-width:520px; margin:0 auto; padding:14px 14px 90px;}
  h1{font-size:20px; margin:6px 2px 14px; letter-spacing:.5px; display:flex; align-items:center; gap:8px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow)}
  .setup-title{font-size:16px; font-weight:800; margin:0 0 14px; display:flex; align-items:center; gap:8px}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  label{font-size:13px; color:var(--muted); display:block; margin:0 0 6px 2px}
  select,input[type=number]{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:#0e1428; color:var(--ink); font-size:16px}
  button{border:0; border-radius:14px; padding:14px 16px; font-size:16px; font-weight:700; color:#fff;
    background:var(--brand); box-shadow:var(--shadow); cursor:pointer; transition:transform .05s}
  button:active{transform:scale(.97)}
  button.ghost{background:#1b2340; color:var(--ink); border:1px solid var(--line); box-shadow:none}
  button.good{background:var(--good)} button.bad{background:var(--bad)}
  .big-start{width:100%; margin-top:16px; padding:18px; font-size:19px; letter-spacing:1px;
    background:linear-gradient(90deg,var(--brand),var(--brand2))}
  .seg{display:flex; gap:8px; background:#0e1428; padding:6px; border-radius:14px; border:1px solid var(--line)}
  .seg button{flex:1; background:transparent; color:var(--muted); box-shadow:none; padding:10px; font-size:14px}
  .seg button.on{background:var(--brand); color:#fff}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px}
  .toggle .t-txt{font-size:14px}
  .toggle .t-txt small{display:block; color:var(--muted); font-size:12px; margin-top:2px}
  .sw{position:relative; width:52px; height:30px; flex:none}
  .sw input{opacity:0; width:0; height:0}
  .sw i{position:absolute; inset:0; background:#0e1428; border:1px solid var(--line); border-radius:99px; transition:.15s}
  .sw i:before{content:""; position:absolute; width:22px;height:22px; left:3px; top:3px; background:var(--muted); border-radius:50%; transition:.15s}
  .sw input:checked+i{background:var(--brand); border-color:var(--brand)}
  .sw input:checked+i:before{transform:translateX(22px); background:#fff}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin-top:8px}

  /* ============ 全螢幕投籃模式 ============ */
  #live{position:fixed; inset:0; z-index:200; background:#05070f; display:none; flex-direction:column; overflow:hidden}
  #live.on{display:flex}
  .pbar{display:flex; align-items:center; gap:10px; color:#fff; font-weight:800; font-size:16px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:linear-gradient(90deg,var(--brand),var(--bad))}
  .pbar .livedot{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  .pbar .sp{flex:1}
  .pbar .xbtn{background:#0006;border:1px solid #ffffff44;padding:8px 12px;font-size:14px;border-radius:12px}
  .pbar .fin{background:#000a;border:1px solid #ffffff66;padding:8px 14px;font-size:14px;border-radius:12px}

  .camwrap{position:relative; flex:1; min-height:0; background:#000}
  .camwrap video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0}
  .camwrap canvas.view{position:absolute; inset:0; width:100%; height:100%; display:block}
  .camwrap .hud{position:absolute; inset:0; touch-action:none; cursor:crosshair}
  #zone{position:absolute; border:3px solid var(--brand); border-radius:8px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.28); background:rgba(255,122,47,.06); pointer-events:none}
  #zone .cross{position:absolute; left:50%; top:50%; width:16px; height:16px; transform:translate(-50%,-50%)}
  #zone .cross:before,#zone .cross:after{content:""; position:absolute; background:var(--brand2)}
  #zone .cross:before{left:50%; top:0; width:2px; height:100%; transform:translateX(-50%)}
  #zone .cross:after{top:50%; left:0; height:2px; width:100%; transform:translateY(-50%)}
  #zone .handle{position:absolute; width:32px;height:32px; right:-16px; bottom:-16px; pointer-events:auto;
    background:var(--brand); border-radius:50%; border:2px solid #fff; touch-action:none}
  .flash{position:absolute; inset:0; background:var(--good); opacity:0; pointer-events:none}
  .flash.on{animation:fl .5s ease-out}
  @keyframes fl{from{opacity:.55}to{opacity:0}}

  /* 疊在相機上的資訊 */
  .ov{position:absolute; background:#000a; backdrop-filter:blur(3px); border-radius:12px; color:#fff}
  .ov-stats{left:10px; top:10px; padding:8px 12px}
  .ov-stats .p{font-size:34px; font-weight:800; line-height:1}
  .ov-stats .f{font-size:12px; color:#cbd5f5; margin-top:2px}
  .ov-streak{right:10px; top:10px; padding:8px 12px; text-align:center}
  .ov-streak b{font-size:22px; display:block; line-height:1}
  .ov-streak span{font-size:11px; color:#cbd5f5}
  .ov-tag{left:10px; bottom:76px; padding:5px 10px; font-size:12px; color:#dfe6ff}
  .ov-counter{left:0; right:0; bottom:12px; display:flex; justify-content:center; align-items:center; gap:18px; background:none}
  .ov-counter button{width:56px;height:56px;border-radius:50%; font-size:26px; padding:0; box-shadow:0 4px 14px #0008}
  .ov-counter .num{font-size:30px; font-weight:800; min-width:64px; text-align:center; background:#000b; border-radius:12px; padding:6px 0}

  /* 底部控制列（固定，不捲動） */
  .pctrls{padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:#0c1224; border-top:1px solid var(--line)}
  .prow{display:flex; gap:14px; align-items:center; margin-bottom:8px}
  .prow:last-child{margin-bottom:0}
  .pslider{flex:1}
  .pslider .lb{font-size:11px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:3px}
  .pslider .lb b{color:var(--brand2)}
  .pslider input{width:100%; margin:0}
  #calBtn{padding:10px 12px; font-size:13px; border-radius:12px; flex:1}
  #swatch{width:36px;height:36px;border-radius:9px;border:2px solid #fff;flex:none;background:#ff7a2f}
  .mmeter{flex:1.2; position:relative; height:14px; background:#0e1428; border:1px solid var(--line); border-radius:99px; overflow:hidden}
  .mmeter>i{position:absolute; left:0;top:0;bottom:0; width:0; background:linear-gradient(90deg,var(--good),var(--brand2))}
  .mmeter>.thr{position:absolute; top:-2px;bottom:-2px; width:3px; background:var(--bad); left:50%}
  .mlbl{font-size:11px; color:var(--muted); flex:none}

  /* 一般分頁 */
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:#0c1224; border-top:1px solid var(--line);
    padding:8px 8px env(safe-area-inset-bottom); z-index:50}
  body.practicing .tabbar{display:none}
  .tabbar button{flex:1; background:transparent; box-shadow:none; color:var(--muted); font-size:13px; padding:8px}
  .tabbar button.on{color:var(--brand)}
  .page{display:none} .page.on{display:block}
  .big{display:flex; align-items:baseline; gap:8px; justify-content:center; margin:2px 0}
  .big .pct{font-size:54px; font-weight:800; letter-spacing:-1px}
  .big .sub{font-size:15px; color:var(--muted)}
  .mini{display:flex; gap:10px; text-align:center; margin-top:8px}
  .mini>div{flex:1; background:#0e1428; border:1px solid var(--line); border-radius:12px; padding:10px 6px}
  .mini b{display:block; font-size:22px} .mini span{font-size:12px; color:var(--muted)}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{padding:9px 6px; border-bottom:1px solid var(--line); text-align:center}
  th{color:var(--muted); font-weight:600; font-size:12px}
  .empty{color:var(--muted); text-align:center; padding:26px 0; font-size:14px}
  .chip{display:inline-block; font-size:12px; padding:3px 9px; border-radius:99px; background:#0e1428; border:1px solid var(--line); color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:#000d; color:#fff;
    padding:10px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .2s; z-index:300}
  .toast.on{opacity:1}
  svg text{fill:var(--muted); font-size:10px}
</style>

<div class="wrap">
  <h1><span class="dot"></span>投籃命中率 · HoopStats</h1>

  <!-- ========== 練習頁（設定） ========== -->
  <div class="page on" id="page-train">
    <div class="card" id="setup">
      <div class="setup-title">⚙️ 練習設定</div>
      <label>投籃距離</label>
      <div class="seg" id="distSeg">
        <button data-d="罰球線" class="on">罰球線</button>
        <button data-d="中距離">中距離</button>
        <button data-d="三分線">三分線</button>
      </div>
      <div style="margin-top:12px">
        <label>這組投幾球</label>
        <input type="number" id="ballsPerSet" value="10" min="1" max="200">
      </div>
      <div class="toggle">
        <div class="t-txt">進球特效<small>進球時閃綠光＋手機震動</small></div>
        <label class="sw"><input type="checkbox" id="fxToggle"><i></i></label>
      </div>
      <div class="hint">按「開始投籃」後會進入<b>全螢幕投籃畫面</b>：把橘框對準籃框、按🎯校正球色點一下你的球，就能開投。所有調整都在同一頁，不用捲動。</div>
      <button class="big-start" id="startBtn">🏀 開始投籃</button>
    </div>
  </div>

  <!-- ========== 統計頁 ========== -->
  <div class="page" id="page-stats">
    <div class="card">
      <label>總覽</label>
      <div class="big"><span class="pct" id="allPct">–</span><span class="sub" id="allFrac"></span></div>
      <div class="mini">
        <div><b id="allSets">0</b><span>練習組數</span></div>
        <div><b id="allBest">0</b><span>歷史最長連中</span></div>
        <div><b id="allShots">0</b><span>總出手數</span></div>
      </div>
    </div>
    <div class="card">
      <label>各距離命中率</label>
      <table id="distTable"><tbody></tbody></table>
    </div>
    <div class="card">
      <label>每日命中率趨勢</label>
      <div id="trend"></div>
    </div>
  </div>

  <!-- ========== 紀錄頁 ========== -->
  <div class="page" id="page-log">
    <div class="card">
      <label>練習紀錄</label>
      <table id="logTable"><thead><tr><th>日期</th><th>距離</th><th>進/投</th><th>命中率</th><th>連中</th><th></th></tr></thead><tbody></tbody></table>
      <div class="empty" id="logEmpty">還沒有紀錄，去練習頁投第一組吧！</div>
    </div>
    <div class="card">
      <button class="ghost" id="exportBtn">匯出資料（CSV）</button>
      <button class="ghost" id="clearBtn" style="margin-top:10px;color:var(--bad)">清空所有紀錄</button>
    </div>
  </div>
</div>

<!-- ========== 全螢幕投籃模式 ========== -->
<div id="live">
  <div class="pbar">
    <span class="livedot"></span><span>投籃中</span>
    <span class="chip" id="pDist" style="color:#fff;background:#ffffff2e;border-color:#ffffff44">罰球線</span>
    <span class="sp"></span>
    <button class="xbtn" id="cancelBtn">✕ 取消</button>
    <button class="fin" id="finishBtn">結束並存檔</button>
  </div>

  <div class="camwrap" id="camwrap">
    <video id="video" playsinline muted></video>
    <canvas class="view" id="view" width="360" height="480"></canvas>
    <div class="hud" id="hud">
      <div id="zone"><span class="cross"></span><span class="handle"></span></div>
    </div>
    <div class="ov ov-stats"><div class="p" id="pPct">0%</div><div class="f" id="pFrac">0 / 0</div></div>
    <div class="ov ov-streak"><b id="pStreak">0</b><span>連中</span></div>
    <div class="ov ov-tag" id="tag">點畫面移動框 · 綠圈=偵測到球</div>
    <div class="ov-counter">
      <button class="bad" id="minus">−</button>
      <div class="num" id="madeNum">0</div>
      <button class="good" id="plus">＋</button>
    </div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="pctrls">
    <div class="prow">
      <div class="pslider">
        <div class="lb"><span>放大籃框</span><b id="zoomVal">1.0×</b></div>
        <input type="range" id="zoom" min="10" max="40" value="10">
      </div>
      <div class="pslider">
        <div class="lb"><span>靈敏度</span><b id="sensVal">中</b></div>
        <input type="range" id="sens" min="1" max="20" value="10">
      </div>
    </div>
    <div class="prow">
      <button class="ghost" id="calBtn">🎯 校正球色（點你的球）</button>
      <span id="swatch" title="目前偵測的球色，點色塊可重設為預設橘色"></span>
      <span class="mlbl">抓球</span>
      <div class="mmeter"><i id="meterFill"></i><div class="thr"></div></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <button class="on" data-p="train">🏀 練習</button>
  <button data-p="stats">📊 統計</button>
  <button data-p="log">📒 紀錄</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='hoopstats.sessions.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(LS,JSON.stringify(a));
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}

/* ---------- 分頁 ---------- */
$$('.tabbar button').forEach(b=>b.onclick=()=>{
  $$('.tabbar button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.page').forEach(p=>p.classList.remove('on'));
  $('#page-'+b.dataset.p).classList.add('on');
  if(b.dataset.p==='stats')renderStats();
  if(b.dataset.p==='log')renderLog();
});

/* ---------- 設定 ---------- */
let dist='罰球線';
$$('#distSeg button').forEach(b=>b.onclick=()=>{
  $$('#distSeg button').forEach(x=>x.classList.toggle('on',x===b)); dist=b.dataset.d;
});
let fx=localStorage.getItem('hoopstats.fx')==='1';
$('#fxToggle').checked=fx;
$('#fxToggle').onchange=e=>{fx=e.target.checked; localStorage.setItem('hoopstats.fx',fx?'1':'0');};

/* ---------- 練習狀態 ---------- */
let ballsPerSet=10, made=0, streak=0, streakMax=0, running=false;
function refreshLive(){
  const total=ballsPerSet, pct=total?Math.round(made/total*100):0;
  $('#pPct').textContent=pct+'%';
  $('#pFrac').textContent=made+' / '+total;
  $('#madeNum').textContent=made;
  $('#pStreak').textContent=streak;
}
function addMake(auto){
  if(!running)return;
  made++; streak++; streakMax=Math.max(streakMax,streak); refreshLive();
  if(fx){
    const f=$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    if(navigator.vibrate)navigator.vibrate(auto?[30,20,30]:20);
  }
  if(made>=ballsPerSet)toast('這組投滿了！可以結束存檔 ✅');
}
$('#plus').onclick=()=>addMake(false);
$('#minus').onclick=()=>{if(made>0){made--; streak=0; refreshLive();}};

/* ---------- 相機 ---------- */
let stream=null, rafId=null, vw=0, vh=0;
const video=$('#video');
const view=$('#view'), vctx=view.getContext('2d',{willReadFrequently:true});
let VW=360, VH=480;                   // 依畫面大小動態調整
function sizeCanvas(){
  const r=$('#camwrap').getBoundingClientRect();
  if(!r.width||!r.height)return;
  const w=Math.min(360,Math.round(r.width));
  view.width=w; view.height=Math.round(w*r.height/r.width);
  VW=view.width; VH=view.height;
}
window.addEventListener('resize',()=>{ if(running)sizeCanvas(); });

let zoom=1;
$('#zoom').oninput=e=>{ zoom=e.target.value/10; $('#zoomVal').textContent=zoom.toFixed(1)+'×'; };
let sens=10;
$('#sens').oninput=e=>{ sens=+e.target.value; $('#sensVal').textContent=sens<=7?'低':sens>=15?'高':'中'; };

/* 球色校正 */
let ballColor=null; try{ ballColor=JSON.parse(localStorage.getItem('hoopstats.ballcolor')||'null'); }catch(e){}
let sampling=false;
function updateSwatch(){ $('#swatch').style.background = ballColor?`rgb(${ballColor.r},${ballColor.g},${ballColor.b})`:'#ff7a2f'; }
updateSwatch();
function isBall(r,g,b){
  if(ballColor){ const tol=60+sens*6; return Math.abs(r-ballColor.r)+Math.abs(g-ballColor.g)+Math.abs(b-ballColor.b)<tol; }
  return r>110 && r-b>50 && r>=g && g>b-25;
}
function sampleColorAt(clientX,clientY){
  const rc=$('#hud').getBoundingClientRect();
  const px=Math.round((clientX-rc.left)/rc.width*VW), py=Math.round((clientY-rc.top)/rc.height*VH);
  const s=6; let R=0,G=0,B=0,n=0;
  try{ const im=vctx.getImageData(Math.max(0,px-s),Math.max(0,py-s),s*2,s*2); const d=im.data;
    for(let i=0;i<d.length;i+=4){ R+=d[i]; G+=d[i+1]; B+=d[i+2]; n++; } }catch(e){ toast('校正失敗，再試一次'); return; }
  if(!n)return;
  ballColor={r:Math.round(R/n),g:Math.round(G/n),b:Math.round(B/n)};
  localStorage.setItem('hoopstats.ballcolor',JSON.stringify(ballColor));
  updateSwatch(); $('#tag').textContent='點畫面移動框 · 綠圈=偵測到球'; toast('已記住球的顏色 🎯');
}
$('#calBtn').onclick=()=>{ sampling=true; $('#tag').textContent='👉 現在點畫面上的「球」'; toast('請點一下畫面上的球'); };
$('#swatch').onclick=()=>{ ballColor=null; localStorage.removeItem('hoopstats.ballcolor'); updateSwatch(); toast('已重設為預設橘色球'); };

async function startCamera(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play();
    vw=video.videoWidth; vh=video.videoHeight; sizeCanvas();
    ballY=null; armed=0; cooldown=0; loop();
  }catch(e){
    toast('⚠️ 無法開啟鏡頭，改用 ＋/− 手動計分');
    $('#tag').textContent='沒有鏡頭：用下方 ＋/− 手動計分';
  }
}
function stopCamera(){ if(rafId)cancelAnimationFrame(rafId); rafId=null; if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;} }

/* 偵測框位置（% of camwrap） */
const zone=$('#zone'); let zx=40,zy=26,zw=20,zh=16;
function applyZone(){ zone.style.left=zx+'%'; zone.style.top=zy+'%'; zone.style.width=zw+'%'; zone.style.height=zh+'%'; }
applyZone();

/* 點/拖移動框；拖圓點縮放；校正模式點球取色 */
(function(){
  const hud=$('#hud'); let mode=null, sx,sy,ow,oh;
  const rect=()=>hud.getBoundingClientRect();
  const pt=e=>{const t=e.touches?e.touches[0]:e; return{x:t.clientX,y:t.clientY};};
  function centerTo(px,py){ const r=rect();
    let cx=(px-r.left)/r.width*100, cy=(py-r.top)/r.height*100;
    zx=Math.min(100-zw,Math.max(0,cx-zw/2)); zy=Math.min(100-zh,Math.max(0,cy-zh/2)); applyZone();
  }
  function down(e){
    const p=pt(e);
    if(sampling){ sampleColorAt(p.x,p.y); sampling=false; e.preventDefault(); return; }
    if(e.target.classList.contains('handle')){ mode='resize'; sx=p.x; sy=p.y; ow=zw; oh=zh; }
    else{ mode='move'; centerTo(p.x,p.y); }
    e.preventDefault();
  }
  function move(e){
    if(!mode)return; const p=pt(e), r=rect();
    if(mode==='move'){ centerTo(p.x,p.y); }
    else{ const dx=(p.x-sx)/r.width*100, dy=(p.y-sy)/r.height*100;
      zw=Math.min(100-zx,Math.max(8,ow+dx)); zh=Math.min(100-zy,Math.max(8,oh+dy)); applyZone(); }
    e.preventDefault();
  }
  const up=()=>mode=null;
  hud.addEventListener('mousedown',down); hud.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
})();

/* 主迴圈：追蹤球，球由上往下穿過籃框才算進 */
let cooldown=0, armed=0, ballY=null;
function loop(){
  rafId=requestAnimationFrame(loop);
  if(!running||video.readyState<2||!vw)return;

  const aspect=VW/VH;
  let bw,bh;
  if(vw/vh>aspect){ bh=vh; bw=bh*aspect; } else { bw=vw; bh=bw/aspect; }
  const cw=bw/zoom, ch=bh/zoom, cx=(vw-cw)/2, cy=(vh-ch)/2;
  vctx.drawImage(video, cx,cy,cw,ch, 0,0,VW,VH);

  let img; try{ img=vctx.getImageData(0,0,VW,VH); }catch(e){ return; }
  const d=img.data; let sx=0,sy=0,cnt=0;
  for(let y=0;y<VH;y+=2){
    const row=y*VW;
    for(let x=0;x<VW;x+=2){
      const i=(row+x)*4;
      if(isBall(d[i],d[i+1],d[i+2])){ sx+=x; sy+=y; cnt++; }
    }
  }
  const minCount=Math.max(3,Math.round((21-sens)*4));
  const present=cnt>=minCount;
  const bx=present?sx/cnt:0, by=present?sy/cnt:0;

  $('#meterFill').style.width=Math.min(100, cnt/(minCount*2)*100)+'%';

  const rx0=zx/100*VW, ry0=zy/100*VH, rx1=(zx+zw)/100*VW, ry1=(zy+zh)/100*VH;
  const mX=(rx1-rx0)*0.6;

  if(cooldown>0)cooldown--;
  if(present){
    const vy=(ballY!=null)?(by-ballY):0;
    const aboveRim=by<ry0 && bx>rx0-mX && bx<rx1+mX;
    const inRim=bx>=rx0 && bx<=rx1 && by>=ry0 && by<=ry1;
    if(aboveRim) armed=18;
    if(armed>0 && inRim && vy>0 && cooldown===0){ addMake(true); cooldown=30; armed=0; }
    ballY=by;
  }else ballY=null;
  if(armed>0)armed--;

  vctx.beginPath();
  if(present){
    vctx.arc(bx,by, Math.max(6,Math.sqrt(cnt)*1.4), 0, 7);
    vctx.lineWidth=3; vctx.strokeStyle=armed>0?'#37d67a':'#ff7a2f'; vctx.stroke();
  }
}

/* ---------- 開始 / 結束 ---------- */
$('#startBtn').onclick=()=>{
  ballsPerSet=Math.max(1,+$('#ballsPerSet').value||10);
  made=0; streak=0; streakMax=0; running=true; armed=0; cooldown=0; ballY=null;
  $('#pDist').textContent=dist;
  document.body.classList.add('practicing');
  $('#live').classList.add('on');
  refreshLive(); requestAnimationFrame(startCamera);
};
function endSession(store){
  running=false; stopCamera();
  if(store){
    const s=load();
    s.push({t:Date.now(), date:new Date().toISOString().slice(0,10), dist, made, total:ballsPerSet, streak:streakMax});
    save(s); toast('已存檔 ✅');
  }
  $('#live').classList.remove('on');
  document.body.classList.remove('practicing');
}
$('#finishBtn').onclick=()=>endSession(true);
$('#cancelBtn').onclick=()=>{ if(confirm('取消這一組？不會存檔。'))endSession(false); };

/* ---------- 統計 ---------- */
function renderStats(){
  const s=load(); let m=0,t=0,best=0; const byDist={};
  s.forEach(x=>{ m+=x.made; t+=x.total; best=Math.max(best,x.streak||0);
    const k=x.dist||'未分類'; byDist[k]=byDist[k]||{m:0,t:0}; byDist[k].m+=x.made; byDist[k].t+=x.total; });
  $('#allPct').textContent=t?Math.round(m/t*100)+'%':'–';
  $('#allFrac').textContent=t?`${m} / ${t}`:'';
  $('#allSets').textContent=s.length; $('#allBest').textContent=best; $('#allShots').textContent=t;
  const tb=$('#distTable tbody'); tb.innerHTML=''; const order=['罰球線','中距離','三分線'];
  Object.keys(byDist).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(k=>{
    const {m,t}=byDist[k]; const p=t?Math.round(m/t*100):0;
    tb.innerHTML+=`<tr><td style="text-align:left"><span class="chip">${k}</span></td><td>${m}/${t}</td><td><b>${p}%</b></td></tr>`;
  });
  if(!s.length)tb.innerHTML='<tr><td class="empty" colspan="3">還沒有資料</td></tr>';
  renderTrend(s);
}
function renderTrend(s){
  const box=$('#trend'); const byDay={};
  s.forEach(x=>{ byDay[x.date]=byDay[x.date]||{m:0,t:0}; byDay[x.date].m+=x.made; byDay[x.date].t+=x.total; });
  const days=Object.keys(byDay).sort().slice(-14);
  if(!days.length){box.innerHTML='<div class="empty">還沒有資料</div>';return;}
  const W=460,H=150,pad=26;
  const pts=days.map((d,i)=>{ const p=byDay[d].t?byDay[d].m/byDay[d].t:0;
    return{x:pad+i*((W-pad*2)/Math.max(1,days.length-1)), y:H-20-p*(H-40), p:Math.round(p*100), d}; });
  const path=pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' ');
  const dots=pts.map(q=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3.5" fill="#ff7a2f"/>
    <text x="${q.x.toFixed(1)}" y="${(q.y-8).toFixed(1)}" text-anchor="middle" fill="#ffb066">${q.p}</text>`).join('');
  const xlab=pts.map((q,i)=>(days.length<=8||i%2===0)?`<text x="${q.x.toFixed(1)}" y="${H-4}" text-anchor="middle">${q.d.slice(5)}</text>`:'').join('');
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="#243052"/>
    <path d="${path}" fill="none" stroke="#ff7a2f" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}${xlab}</svg>`;
}

/* ---------- 紀錄 ---------- */
function renderLog(){
  const s=load().slice().reverse(); const tb=$('#logTable tbody'); tb.innerHTML='';
  $('#logEmpty').style.display=s.length?'none':'block';
  s.forEach(x=>{ const p=x.total?Math.round(x.made/x.total*100):0;
    tb.innerHTML+=`<tr><td>${x.date.slice(5)}</td><td><span class="chip">${x.dist}</span></td>
      <td>${x.made}/${x.total}</td><td><b>${p}%</b></td><td>${x.streak||0}</td>
      <td><button class="ghost" style="padding:6px 10px;font-size:12px" onclick="delRow(${x.t})">刪</button></td></tr>`;
  });
}
window.delRow=t=>{ if(!confirm('刪除這筆紀錄？'))return; save(load().filter(x=>x.t!==t)); renderLog(); };
$('#clearBtn').onclick=()=>{ if(confirm('確定清空所有練習紀錄？無法復原。')){save([]); renderLog(); renderStats(); toast('已清空');} };
$('#exportBtn').onclick=()=>{
  const s=load(); if(!s.length){toast('沒有資料可匯出');return;}
  const rows=[['日期','距離','進球','出手','命中率%','最長連中']];
  s.forEach(x=>rows.push([x.date,x.dist,x.made,x.total, x.total?Math.round(x.made/x.total*100):0, x.streak||0]));
  const csv='﻿'+rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='hoopstats.csv'; a.click(); toast('已匯出 CSV');
};

refreshLive();
</script>
